<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FocusBlock</title>
        <link rel="stylesheet" href="./assets/style.css" />
    </head>
    <body>
        <div class="container fade-in">
            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">🛡️</div>
                    <div class="logo-text">
                        <h1>FocusBlock</h1>
                        <p>Stay focused, stay productive</p>
                    </div>
                </div>
                <button id="themeToggle" class="theme-toggle">🌙</button>
            </div>

            <!-- Blocked Sites Section -->
            <div class="section">
                <div class="section-header">
                    <span>🚫</span>
                    <h3>Blocked Websites</h3>
                </div>

                <div class="input-group">
                    <input
                        id="siteInput"
                        type="text"
                        placeholder="Enter website (e.g. facebook.com)"
                        class="input-field"
                    />
                    <button id="addSite" class="btn btn-small">Add</button>
                </div>

                <div id="siteList" class="list-container"></div>
            </div>

            <!-- Schedule Section -->
            <div class="section">
                <div class="section-header">
                    <span>📅</span>
                    <h3>Schedule</h3>
                </div>

                <!-- Days Selection -->
                <div class="label-text">Select days:</div>
                <div class="days-container">
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="mon" />
                        <span class="day-pill">Mon</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="tue" />
                        <span class="day-pill">Tue</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="wed" />
                        <span class="day-pill">Wed</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="thu" />
                        <span class="day-pill">Thu</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="fri" />
                        <span class="day-pill">Fri</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="sat" />
                        <span class="day-pill">Sat</span>
                    </label>
                    <label class="day-label">
                        <input type="checkbox" class="day-input" id="sun" />
                        <span class="day-pill">Sun</span>
                    </label>
                </div>

                <!-- Time Selection -->
                <div class="label-text">Add time blocks:</div>
                <div class="time-inputs">
                    <input type="time" id="startTime" class="input-field" />
                    <span class="time-separator">to</span>
                    <input type="time" id="endTime" class="input-field" />
                    <button id="addSession" class="btn btn-large">Add</button>
                </div>

                <div id="sessionList" class="list-container"></div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText" class="status-text"
                        >Ready to focus</span
                    >
                </div>
                <div class="counter">
                    <span id="blockedCount">0</span> sites blocked
                </div>
            </div>

            <!-- Save Button -->
            <button id="saveButton" class="btn btn-large">
                🚀 Save Settings
            </button>
        </div>
        <script src="popup.js"></script>
        <script src="theme.js"></script>
    </body>
</html>
